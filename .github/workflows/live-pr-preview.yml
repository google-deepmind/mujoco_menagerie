name: MuJoCo Live

on:
  pull_request:
    paths:
      - '**/*.xml'

permissions:
  contents: read
  pull-requests: read

jobs:
  generate-previews:
    name: 🚀 MuJoCo Live Previews
    runs-on: ubuntu-latest
    steps:
      - name: Collect list of XML files
        id: changed-xml-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files: '**/*.xml'

      - name: Publish MuJoCo Live links
        if: steps.changed-xml-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-xml-files.outputs.all_changed_files }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### 🚀 MuJoCo Live Previews"
            echo "Preview links for modified XML files in this Pull Request:"
            echo ""
            for file in $CHANGED_FILES; do
              URL="https://live.mujoco.org/?model=github:${REPO}/pull/${PR_NUMBER}/head/${file}"
              echo "- [\`${file}\`](${URL})"
            done
          } >> "$GITHUB_STEP_SUMMARY"
