name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: test/requirements.txt
      - name: Install dependencies
        run: uv pip install --system -r test/requirements.txt
      - name: Test with pytest
        run: pytest -n auto
